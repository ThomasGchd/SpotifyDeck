name: Build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build
        run: dotnet build src/SpotifyDeck/SpotifyDeck.csproj -c Release

      - name: Publish portable Windows build
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          dotnet publish src/SpotifyDeck/SpotifyDeck.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -p:Version=0.2.0 `
            -o publish

      - name: Inject Spotify public client id
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $clientId = "${{ vars.SPOTIFY_CLIENT_ID }}"
          if (![string]::IsNullOrWhiteSpace($clientId)) {
            Set-Content -Path publish\spotify-client-id.txt -Value $clientId -NoNewline
          }

      - name: Upload portable test build
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: SpotifyDeck-portable-win-x64
          path: publish/
          if-no-files-found: error
          retention-days: 14

      - name: Build installer smoke test
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
          }
          & $iscc "/DMyAppVersion=0.2.0" "installer\SpotifyDeck.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke-test installer contents
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP "SpotifyDeckSmoke"
          $installer = Resolve-Path "installer-output\SpotifyDeck-Setup-win-x64.exe"
          $process = Start-Process -FilePath $installer -ArgumentList @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/SP-",
            "/DIR=$target"
          ) -PassThru -Wait
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
          if (!(Test-Path (Join-Path $target "SpotifyDeck.exe"))) {
            throw "SpotifyDeck.exe missing after install"
          }
          if (Test-Path (Join-Path $target "bridge\spotifydeck-bridge.js")) {
            throw "Legacy Spicetify bridge must not ship in standalone builds"
          }

      - name: Upload installer test build
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: SpotifyDeck-installer-win-x64
          path: installer-output/SpotifyDeck-Setup-win-x64.exe
          if-no-files-found: error
          retention-days: 14
