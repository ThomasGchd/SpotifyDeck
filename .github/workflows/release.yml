name: Release Windows

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          dotnet publish src/SpotifyDeck/SpotifyDeck.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -p:Version=$version `
            -o publish

      - name: Inject Spotify public client id
        shell: pwsh
        run: |
          $clientId = "${{ vars.SPOTIFY_CLIENT_ID }}"
          if (![string]::IsNullOrWhiteSpace($clientId)) {
            Set-Content -Path publish\spotify-client-id.txt -Value $clientId -NoNewline
          }

      - name: Package portable updater payload
        shell: pwsh
        run: |
          Compress-Archive -Path publish\* -DestinationPath SpotifyDeck-win-x64.zip -Force

      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
          }
          & $iscc "/DMyAppVersion=$version" "installer\SpotifyDeck.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SpotifyDeck-win-x64.zip
            installer-output/SpotifyDeck-Setup-win-x64.exe
          generate_release_notes: true
